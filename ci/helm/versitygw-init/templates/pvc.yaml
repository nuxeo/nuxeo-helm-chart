apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pvcName }}
  labels:
    app.kubernetes.io/name: versitygw-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # pre-install hook so Helm creates the PVC without waiting for it to bind.
    # A WaitForFirstConsumer StorageClass would deadlock if the PVC were a
    # regular resource: --wait would block on binding, but binding only
    # happens when a pod (the Job below) requests the PVC — and the Job is a
    # hook that cannot run until --wait unblocks.
    # Making the PVC a hook breaks the deadlock: Helm creates it and moves on,
    # then the Job pod requests it and triggers binding immediately.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    # Delete and recreate the PVC on each deploy so the bucket directory is
    # always freshly initialised in a new test namespace.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  accessModes:
  - {{ .Values.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
